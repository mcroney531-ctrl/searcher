# Single source of truth for grading. Every grader (API pipeline, Chrome deep-read)
# loads this file; nothing else defines "fit". Bump `version` on any change and
# re-grade history from stored descriptions instead of re-fetching.
#
# DRAFT: criteria marked TODO(rone) need your real thresholds before v1.0 ships.

version: v0.1-draft

# Stage 1: hard gates. Any `fail` hit kills the job before scoring.
# `review` hits keep it in the queue but mark it for a human look.
gates:
  - id: client_ownership
    question: Is the role accountable for owning client/customer accounts, revenue, or renewals?
    fail_when: owns_accounts   # quota, book of business, account management as primary duty
    review_when: unclear
  - id: audience_seniority
    question: Is the primary audience of the content far off target (e.g. K-12 students, or C-suite exec coaching)?
    fail_when: clear_mismatch
    review_when: unclear
    notes: TODO(rone) name the audiences that are in-bounds vs out.
  - id: level
    question: Is the role clearly below or above target level?
    fail_when: clear_mismatch
    notes: TODO(rone) target level band (e.g. senior IC through lead/manager?).
  - id: location
    question: Is the location/remote policy workable?
    fail_when: incompatible
    notes: TODO(rone) remote-only? acceptable metros? time zones?
  - id: comp_floor
    question: If salary is posted, is the max below the floor?
    fail_when: below_floor
    notes: TODO(rone) floor. Missing salary never fails; it goes in missing_evidence.

# Stage 2: classify. Must be one of search/families.yaml ids, or `other`.
role_family: {source: search/families.yaml}

# Stage 3: dimension scores, 0-4. Anchors keep graders from drifting.
dimensions:
  content_fit:
    what: Is content development/design the core of the job (not a side duty)?
    anchors:
      0: Content is incidental or absent.
      1: Content is one of many duties; role is mostly something else (ops, sales, PM).
      2: Content is a major duty but shares the center with another function.
      3: Content creation/design is the core deliverable.
      4: Content is the core AND the role owns strategy/system, not just production.
  ai_fit:
    what: Is AI/LLM work a meaningful differentiator, not a buzzword?
    anchors:
      0: No AI component.
      1: AI mentioned as a nice-to-have or tooling footnote.
      2: Uses AI tools in the workflow as an expectation.
      3: Content is about AI (teaching/enabling AI adoption) or builds AI-assisted content systems.
      4: Both of 3's conditions, or AI is the reason the role exists.
  seniority_fit:
    what: Does the level match? (TODO(rone) same band as gates.level)
    anchors: {0: far off, 2: adjacent, 4: exact}
  audience_fit:
    what: Is the content's audience one you want to serve?
    anchors: {0: off-target, 2: neutral, 4: ideal}

# Stage 4: flags the model lists but does not score.
red_flags:
  - agency_or_contract_to_hire_unstated
  - "unicorn stack: content + design + video + dev + marketing ops"
  - ai_as_replacement_for_writers
  - repost_churn    # set by the pipeline from job history, not by the model

# Stage 5: rank is computed in code from the fields above, never asked of the model.
# That keeps "78 because AI-great-but-owns-clients" impossible: that job died at the gate.
rank:
  requires_gate: pass   # `review` jobs are ranked but shown in a separate lane
  weights: {content_fit: 0.40, ai_fit: 0.30, seniority_fit: 0.15, audience_fit: 0.15}
  confidence_penalty: {high: 0.0, medium: 0.05, low: 0.15}

# Output contract the grader must return (validated as JSON before storage).
output_schema:
  gate: [pass, fail, review]
  gate_reasons: list[str]
  role_family: str
  content_fit: int
  ai_fit: int
  seniority_fit: int
  audience_fit: int
  client_ownership: [none, supporting, owns_accounts, unclear]
  red_flags: list[str]
  confidence: [high, medium, low]
  missing_evidence: list[str]
  reason: str   # one line, <= 25 words
